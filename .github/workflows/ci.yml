name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the build/test job only needs to read the repo. Uploading test
# results uses the artifact API, which doesn't need extra token scopes.
permissions:
  contents: read

# Cancel an in-progress run when a branch is pushed again — but never an
# in-progress main run (a permanently "cancelled" main commit masks breakage).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: Invoque.xcodeproj
  SCHEME: Invoque

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      # Pin actions to commit SHAs: a mutable tag can be repointed at tampered code,
      # a SHA cannot. Same pin-and-verify discipline zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing after checkout needs credentials

      # The committed app icon must match what the script regenerates from
      # media-sources/icon2.png — otherwise the appiconset silently drifts
      # from its source of truth.
      - name: Check app icon is regenerated
        run: python3 scripts/make-app-icon.py --verify

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Check Numbat helper
        working-directory: Numbat
        run: |
          rustup show
          cargo fmt --check
          cargo test --locked

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO \
            test | xcbeautify

      - name: Verify universal calculator packaging
        run: |
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/NumbatPackaging" \
            CODE_SIGNING_ALLOWED=NO
          APP="$RUNNER_TEMP/NumbatPackaging/Build/Products/Release/Invoque.app"
          HELPER="$APP/Contents/Helpers/invoque-numbat"
          lipo -verify_arch arm64 x86_64 "$HELPER"
          test "$("$HELPER" '2 km -> m')" = '2000 m'
          test -s "$APP/Contents/Resources/Numbat-Licenses.txt"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Upload test results on failure
        # `failure()` alone misses the timeout case: a wedged test run ends as
        # *cancelled*, and the xcresult is the only diagnostic for a hang.
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
