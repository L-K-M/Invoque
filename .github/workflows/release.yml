name: Release

on:
  push:
    tags: ['v*']        # e.g. v1.2.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # needed to create the GitHub Release

env:
  PROJECT: Invoque.xcodeproj
  SCHEME: Invoque
  APP_NAME: Invoque

jobs:
  release:
    name: Build & publish (unsigned)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      # Pin actions to commit SHAs: a mutable tag can be repointed at tampered code,
      # a SHA cannot — and this workflow holds contents:write and produces the bytes
      # every in-app updater ships. Matches the pinning zai-code-review.yml already uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after checkout; don't leave a
          # contents:write token sitting in .git/config for the whole build.
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.2'

      - name: Install tooling
        run: brew install xcbeautify create-dmg

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build (Release, no Developer ID signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Locate & ad-hoc sign the app
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name "$APP_NAME.app" -print -quit)
          [ -n "$APP" ] || { echo "::error::built $APP_NAME.app not found"; exit 1; }
          # Ad-hoc sign (identity "-"): no certificate, keychain, or API key required,
          # but it IS required for the app to launch on Apple Silicon. This is not a
          # Developer ID signature and the app is not notarized — Gatekeeper still warns.
          codesign --force --deep --sign - "$APP"
          # A bad or partial signature only surfaces on users' machines otherwise.
          codesign --verify --strict --verbose=2 "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package zip + DMG
        run: |
          ZIP="$RUNNER_TEMP/$APP_NAME-$VERSION.zip"
          DMG="$RUNNER_TEMP/$APP_NAME-$VERSION.dmg"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          # create-dmg can exit non-zero on a headless runner even on success — verify the file.
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 390 185 \
            "$DMG" "$APP_PATH" || true
          [ -f "$DMG" ] || { echo "::error::DMG was not created"; exit 1; }
          # `-f` alone passes on a half-written image; verify integrity.
          hdiutil verify "$DMG"
          # `hdiutil verify` checks the image checksum, not what create-dmg
          # copied in. Verify the bundle users actually get from inside it.
          MNT="$(mktemp -d)"
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" >/dev/null
          codesign --verify --deep --strict "$MNT/$(basename "$APP_PATH")"
          hdiutil detach "$MNT" >/dev/null || true
          trap - EXIT
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # Publish as a draft first: the byte-compare below is meaningless if the
      # assets are already public when the job dies between upload and verify.
      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          files: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ### Unsigned build

            This app is **not** code-signed with a Developer ID or notarized, so macOS
            Gatekeeper will warn on first launch. To open it:

            - **Right-click** (or Control-click) the app → **Open** → **Open**, or
            - run `xattr -dr com.apple.quarantine /Applications/${{ env.APP_NAME }}.app`

      # Never trust an upload: download what GitHub actually serves for the tag and
      # byte-compare it against what was just built. A truncated or corrupt upload
      # would otherwise ship silently — and the in-app updater offers these exact
      # assets to every user.
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" \
            --pattern "$(basename "$ZIP")" --pattern "$(basename "$DMG")"
          failed=0
          for f in "$ZIP" "$DMG"; do
            if ! cmp -- "$f" "$RUNNER_TEMP/published/$(basename "$f")"; then
              # The published copy provably differs from what was built: take it
              # down before failing, so the in-app updater can't keep serving
              # corrupt bytes while someone investigates. Keep checking, so a
              # second bad asset is also caught and removed in the same run.
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" -y \
                || echo "::warning::failed to remove mismatched asset $(basename "$f") — take it down manually"
              echo "::error::published $(basename "$f") differed from the built artifact and was removed"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          # Both assets byte-match the build — only now make the release public.
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
